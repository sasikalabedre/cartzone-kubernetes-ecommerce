apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cartzone-postgres
  namespace: work
spec:
  serviceName: cartzone-postgres
  replicas: 1
  selector:
    matchLabels:
      app: cartzone-postgres
  template:
    metadata:
      labels:
        app: cartzone-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: cartzone-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: cartzone-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cartzone-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: cartzone-postgres-pvc
