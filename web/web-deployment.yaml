apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartzone-web
  namespace: work
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cartzone-web
  template:
    metadata:
      labels:
        app: cartzone-web
    spec:
      containers:
        - name: web
          image: cartzone-web:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
