apiVersion: v1
kind: Pod
metadata:
  name: cartzone-backup-inspect
  namespace: work
spec:
  restartPolicy: Never
  containers:
    - name: inspector
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: backup-storage
          mountPath: /backups
  volumes:
    - name: backup-storage
      persistentVolumeClaim:
        claimName: cartzone-backup-pvc
