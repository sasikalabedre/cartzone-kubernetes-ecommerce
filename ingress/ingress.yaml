apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cartzone-ingress
  namespace: work
spec:
  ingressClassName: nginx
  rules:
    - host: cartzone.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cartzone-web
                port:
                  number: 80
