apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartzone-api
  namespace: work
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cartzone-api
  template:
    metadata:
      labels:
        app: cartzone-api
    spec:
      containers:
        - name: api
          image: cartzone-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: DB_HOST
              value: cartzone-postgres
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: cartzone-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: cartzone-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cartzone-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
